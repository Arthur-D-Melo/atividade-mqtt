services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: detran-mosquitto

    ports:
      - "1883:1883"

    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

    restart: unless-stopped


  init-db:
    build: .
    container_name: detran-init-db

    command:
      - python
      - init_db.py

    environment:
      DATABASE_PATH: /app/data/detran.db

    volumes:
      - ./data:/app/data


  condutores:
    build: .
    container_name: detran-condutores

    command:
      - python
      - condutores_service.py

    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      DATABASE_PATH: /app/data/detran.db

    volumes:
      - ./data:/app/data

    depends_on:
      init-db:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started

    restart: on-failure


  veiculos:
    build: .
    container_name: detran-veiculos

    command:
      - python
      - veiculos_service.py

    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      DATABASE_PATH: /app/data/detran.db

    volumes:
      - ./data:/app/data

    depends_on:
      init-db:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started

    restart: on-failure


  multas:
    build: .
    container_name: detran-multas

    command:
      - python
      - multas_service.py

    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      DATABASE_PATH: /app/data/detran.db

    volumes:
      - ./data:/app/data

    depends_on:
      init-db:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started

    restart: on-failure


  client:
    build: .

    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883

    depends_on:
      mosquitto:
        condition: service_started

    profiles:
      - tools